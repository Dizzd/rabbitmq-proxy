[package]
name = "rabbitmq-proxy"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
description = "HTTP to RabbitMQ listener and RabbitMQ to HTTP forwarder"
license = "MIT"

[[bin]]
name = "rabbitmq-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
lapin = { version = "4.12", default-features = false, features = ["rustls", "rustls-webpki-roots-certs", "tokio"] }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
