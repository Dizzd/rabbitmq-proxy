services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-pms:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: "8080"
    ports:
      - "8081:8080"
